server:
  port: 8081

spring:
  application:
    name: bootcamp-xp-edu
  mongodb:
    uri: ${ENV_MONGO_DB_URI}
    database: ${ENV_MONGO_DB_DATABASE}
  data:
    mongodb:
      auto-index-creation: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    display-request-duration: true
    disable-swagger-default-url: true

logging:
  level:
    br.com.gagjunior.bootcampxpedu: INFO
